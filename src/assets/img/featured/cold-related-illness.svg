<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Cold-related illness hospitalizations nearly tripled</title>
  <desc id="d">Age- and sex-adjusted rate of cold-related illness hospitalizations per 100,000 hospitalizations: 42.0 in 1998 and 122.5 in 2022.</desc>
  <rect width="480" height="300" fill="#ffffff"/>
  <text x="24" y="38" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#111">Cold-related illness hospitalizations</text>
  <text x="24" y="58" font-family="Inter, Arial, sans-serif" font-size="12" fill="#555">Per 100,000 US hospitalizations, age- and sex-adjusted</text>
  <line x1="24" y1="250" x2="456" y2="250" stroke="#d4d4d4"/>
  <rect x="96" y="211" width="96" height="39" fill="#9ca3af"/>
  <rect x="288" y="136" width="96" height="114" fill="#c2410c"/>
  <text x="144" y="201" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#111">42.0</text>
  <text x="336" y="126" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#c2410c">122.5</text>
  <text x="144" y="272" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#333">1998</text>
  <text x="336" y="272" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#333">2022</text>
  <text x="456" y="290" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="10" fill="#777">Source: Patel et al., Health Affairs, 2026</text>
</svg>
